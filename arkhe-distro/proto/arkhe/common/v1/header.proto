syntax = "proto3";

package arkhe.common.v1;

message ArkheHeader {
  string trace_id = 1;
  string session_id = 2;
  string substrate_id = 3;
  int64 timestamp_ns = 4;
  bytes payload_hash = 5;
  bytes signature = 6;
  string schema_version = 7;
}

message ArkheSeal {
  bytes zk_proof = 1;
  string temporal_anchor = 2;
  bytes epistemic_hash = 3;
  string circuit_id = 4;
}
