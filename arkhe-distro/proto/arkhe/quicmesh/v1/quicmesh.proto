syntax = "proto3";

package arkhe.quicmesh.v1;

import "arkhe/common/v1/header.proto";

service QUICMeshService {
  rpc OpenChannel(OpenChannelRequest) returns (ChannelInfo);
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc Subscribe(SubscribeRequest) returns (stream MeshMessage);
  rpc MeshStatus(MeshStatusRequest) returns (MeshStatusResponse);
}

message OpenChannelRequest {
  arkhe.common.v1.ArkheHeader header = 1;
  string channel_id = 2;
  string channel_type = 3;
  int32 retention_sec = 4;
}

message ChannelInfo {
  string id = 1;
}

message PublishRequest {
  arkhe.common.v1.ArkheHeader header = 1;
  string channel_id = 2;
  bytes payload = 3;
  bool quorum_ack = 4;
  int32 quorum_size = 5;
}

message PublishResponse {
  string message_id = 1;
  int32 replicas_ack = 2;
  bool quorum_reached = 3;
}

message SubscribeRequest {
  arkhe.common.v1.ArkheHeader header = 1;
  string channel_id = 2;
  string payload_type_filter = 3;
  int64 from_timestamp_ns = 4;
}

message MeshMessage {
  arkhe.common.v1.ArkheHeader header = 1;
  string channel_id = 2;
  bytes payload = 3;
  bytes nonce = 4;
  int32 ttl_hops = 5;
  repeated string route = 6;
}

message MeshStatusRequest {
  string node_id = 1;
}

message MeshStatusResponse {
  string mesh_id = 1;
  int32 node_count = 2;
  int32 channel_count = 3;
  int32 messages_per_sec = 4;
  repeated NodeHealth nodes = 5;
}

message NodeHealth {
  string node_id = 1;
  string addr = 2;
  bool healthy = 3;
  int64 last_seen_ns = 4;
  float latency_ms = 5;
}
