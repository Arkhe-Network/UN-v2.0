<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkhe λ₂-UNSC Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-4">Arkhe Global Coherence Monitor — λ₂-UNSC</h1>
        <p class="text-slate-400 mb-8">Visualização histórica de coerência e paralisia decisória (1945-2026)</p>

        <div class="bg-slate-800 p-6 rounded-lg shadow-xl mb-8">
            <canvas id="coherenceChart"></canvas>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-4 rounded-lg border-l-4 border-red-500">
                <h3 class="text-sm uppercase text-slate-400">λ₂-Global Atual</h3>
                <p class="text-2xl font-mono">0.59 <span class="text-red-500 text-sm">CRITICAL</span></p>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg border-l-4 border-yellow-500">
                <h3 class="text-sm uppercase text-slate-400">Veto Efficiency</h3>
                <p class="text-2xl font-mono">$2.4B</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg border-l-4 border-green-500">
                <h3 class="text-sm uppercase text-slate-400">Active Subnets</h3>
                <p class="text-2xl font-mono">24 (Nomos, Synapse...)</p>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('coherenceChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['1945', '1960', '1975', '1990', '2005', '2020', '2026'],
                datasets: [{
                    label: 'λ₂-Coherence Score',
                    data: [0.95, 0.82, 0.65, 0.88, 0.72, 0.61, 0.59],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, max: 1, grid: { color: '#334155' } },
                    x: { grid: { color: '#334155' } }
                },
                plugins: {
                    legend: { labels: { color: 'white' } }
                }
            }
        });
    </script>
</body>
</html>
